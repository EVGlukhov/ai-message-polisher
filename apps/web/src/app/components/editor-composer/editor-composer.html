<app-editor-panel>
  <app-editor-panel-header>
    <app-editor-panel-heading iconName="message">
      Ваше сообщение
    </app-editor-panel-heading>
    <app-button variant="ghost" [disabled]="!canRewrite()" (pressed)="clear()">
      Очистить
    </app-button>
  </app-editor-panel-header>
  <app-textarea
    label="Ваше сообщение"
    placeholder="Введите или вставьте сообщение, которое хотите улучшить…"
    [formField]="messageForm.text"
  />
  <app-editor-footer>
    <app-editor-info [wordCount]="wordCount()"></app-editor-info>
    <app-button variant="primary" [disabled]="!canRewrite()">
      <app-icon name="sparkle"></app-icon>
      Исправить текст
    </app-button>
  </app-editor-footer>
</app-editor-panel>
