<textarea
  [attr.aria-label]="label()"
  [value]="value()"
  [placeholder]="placeholder()"
  [disabled]="disabled()"
  [readOnly]="readOnly()"
  (input)="handleInput($event)"
  (blur)="touch.emit()"
  appTypography="body"
  class="min-h-0 w-full flex-1 resize-none rounded-lg border border-transparent bg-transparent p-3 sm:p-4 outline-none placeholder:text-zinc-400 transition-colors duration-200 hover:border-zinc-200 read-only:hover:border-transparent hover:bg-zinc-50 focus:border-violet-300 focus:bg-white focus:ring-4 focus:ring-violet-100 disabled:cursor-not-allowed disabled:bg-zinc-50 disabled:opacity-70 read-only:cursor-default read-only:focus:border-transparent read-only:focus:ring-0 read-only:bg-white read-only:focus:bg-white read-only:hover:bg-white"
></textarea>
