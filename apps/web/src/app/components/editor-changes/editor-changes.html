<div class="flex w-full min-w-0 flex-col gap-3.5">
  <div
    class="flex w-full min-w-0 flex-col items-start gap-1 sm:flex-row sm:items-center sm:justify-between sm:gap-4"
  >
    <p appTypography="panelTitle" class="min-w-0">
      Несколько небольших правок
    </p>
    <p appTypography="caption" class="min-w-0">
      Подсвеченные слова показывают, что изменилось
    </p>
  </div>

  <div class="grid w-full min-w-0 grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-3">
    @for (change of polishStore.changes(); track $index) {
      <app-editor-changes-panel>
        <p appTypography="sectionLabel">{{ change.category }}</p>
        <p appTypography="body">
          <span appTypography="bodyMuted">
            <i class="line-through">{{ change.original }}</i> →
          </span>
          <span appTypography="highlight">{{ change.replacement }}</span>
        </p>
        <p appTypography="caption">{{ change.explanation }}</p>
      </app-editor-changes-panel>
    }
  </div>
</div>
