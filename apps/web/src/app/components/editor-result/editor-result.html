<app-editor-panel>
  <app-editor-panel-header>
    <app-editor-panel-heading iconName="sparkle">
      Отредактированное сообщение
    </app-editor-panel-heading>
    <app-badge>
      Ожидание текста
    </app-badge>
  </app-editor-panel-header>

  <!-- <app-textarea
    label="Ваше сообщение"
    [formField]="resultForm.text"
    [readOnly]="true"
  /> -->
  <app-editor-panel-placeholder></app-editor-panel-placeholder>
  <app-editor-footer>
    <p class="grow-0 shrink-0 text-xs text-left text-zinc-500">
      Сначала добавьте сообщение
    </p>
    <app-button variant="secondary" [disabled]="!canCopy()">
      <app-icon name="copy"></app-icon>
      Копировать текст
    </app-button>
  </app-editor-footer>
</app-editor-panel>
